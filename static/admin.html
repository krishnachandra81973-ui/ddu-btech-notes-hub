<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal | DDU B.Tech Notes Hub — Gorakhpur University</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="/static/css/style.css?v=3">
  <link rel="icon" type="image/png" href="/logo.png?v=3">
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=3">
  <link rel="shortcut icon" href="/favicon.ico?v=3" type="image/x-icon">
  <link rel="apple-touch-icon" href="/logo.png?v=3">
</head>
<body>

  <!-- Top Admin Navbar -->
  <header class="navbar" style="border-bottom: 2px solid var(--primary);">
    <div class="container nav-container">
      <div class="brand-link">
        <img src="/logo.png?v=3" alt="DDU-BTech KN Notes Logo" class="brand-logo-img" onerror="this.src='/static/ddu_official_logo.png'">
        <div class="brand-info">
          <span class="brand-title">DDU B.Tech Notes Hub <span style="font-size: 0.75rem; background: var(--primary-light); color: var(--primary); padding: 2px 8px; border-radius: 4px; margin-left: 6px; font-weight: 800;">ADMIN</span></span>
          <span class="brand-subtitle">Administrator Content Management System</span>
        </div>
      </div>

      <div class="nav-actions">
        <!-- Dark / Light Theme Toggle -->
        <button onclick="App.toggleTheme()" id="theme-toggle-btn" class="theme-toggle-btn" title="Toggle Dark/Light Mode">
          🌙
        </button>

        <div id="admin-header-actions" style="display: flex; align-items: center; gap: 10px;">
          <!-- Injected via admin-app.js -->
        </div>
      </div>
    </div>
  </header>

  <!-- Main Admin Workspace -->
  <main id="admin-root-container" style="flex-grow: 1;">
    <!-- Injected dynamically: either Login Gate or Admin Dashboard -->
  </main>

  <!-- Fullscreen PDF Viewer Modal for Admin -->
  <div id="pdf-viewer-modal" class="modal-overlay" onclick="if(event.target === this) App.closeAllModals()">
    <div class="modal-box modal-lg" style="height: 90vh; max-height: 900px; display: flex; flex-direction: column;">
      <div class="modal-header" style="flex-shrink: 0; flex-wrap: wrap; gap: 10px;">
        <div style="display: flex; align-items: center; gap: 10px; min-width: 200px; flex: 1;">
          <span style="font-size: 1.3rem;">📄</span>
          <div style="overflow: hidden;">
            <h3 id="pdf-viewer-title" class="modal-title" style="font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Document Preview</h3>
            <span style="font-size: 0.75rem; color: var(--text-muted);">Admin Preview Mode</span>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
          <a id="pdf-viewer-external-link" href="#" target="_blank" rel="noopener noreferrer" class="btn-secondary btn-sm" style="display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; font-weight: 600;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            Open Fullscreen ↗
          </a>
          <a id="pdf-viewer-download-link" href="#" download class="btn-primary btn-sm" style="display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; font-weight: 600;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Download PDF
          </a>
          <button onclick="App.closeAllModals()" class="modal-close-btn" style="margin-left: 4px;">✕</button>
        </div>
      </div>
      <div id="pdf-viewer-mobile-tip" style="display: none;"></div>
      <div class="modal-body" style="padding: 0; background: #525659; overflow: auto; flex: 1; height: 100%; position: relative; display: flex; align-items: center; justify-content: center;">
        <iframe id="pdf-viewer-frame" src="about:blank" style="width: 100%; height: 100%; border: none;"></iframe>
        <img id="pdf-viewer-image" src="" alt="Notice / Attachment Preview" style="display: none; max-width: 100%; max-height: 100%; object-fit: contain; margin: auto; padding: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); border-radius: 4px; background: #1e293b;">
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/static/js/auth.js?v=5"></script>
  <script src="/static/js/admin.js?v=5"></script>
  <script>
    // Standalone Admin Application Orchestrator
    const AdminApp = {
      async init() {
        App.initTheme();
        Auth.token = localStorage.getItem("ddu_token") || null;
        if (!Auth.token) {
          Auth.currentUser = null;
          this.renderState();
          return;
        }
        await Auth.init();
        if (!Auth.currentUser || Auth.currentUser.role !== "ADMIN") {
          Auth.currentUser = null;
          Auth.token = null;
          localStorage.removeItem("ddu_token");
          localStorage.removeItem("ddu_user");
          this.renderState();
          return;
        }
        this.renderState();
      },

      renderState() {
        const root = document.getElementById("admin-root-container");
        const headerActions = document.getElementById("admin-header-actions");
        if (!root) return;

        if (Auth.currentUser && Auth.currentUser.role === "ADMIN") {
          // Render full Admin Dashboard
          headerActions.innerHTML = `
            <div style="font-size: 0.85rem; font-weight: 700; color: var(--text-main);">${escapeHtml(Auth.currentUser.full_name)}</div>
            <a href="/" target="_blank" class="btn-secondary btn-sm">View Live Site ↗</a>
            <button onclick="AdminApp.logout()" class="btn-outline-danger btn-sm">Sign Out</button>
          `;
          Admin.render(root);
        } else {
          // Render dedicated Admin Login Gate
          headerActions.innerHTML = `
            <a href="/" class="btn-secondary btn-sm">← Back to Main Site</a>
          `;
          root.innerHTML = `
            <div class="container" style="max-width: 480px; padding: 70px 20px;">
              <div style="background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 36px 30px; box-shadow: var(--shadow-xl);">
                <div style="text-align: center; margin-bottom: 24px;">
                  <img src="/static/ddu_official_logo.png" alt="DDU Crest" style="width: 70px; height: 70px; object-fit: contain; margin-bottom: 12px;">
                  <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--text-main);">Administrator Login</h1>
                  <p style="font-size: 0.82rem; color: var(--text-muted); margin-top: 4px;">
                    Restricted Area: Deen Dayal Upadhyaya Gorakhpur University B.Tech Portal Management
                  </p>
                </div>

                <form id="standalone-admin-login-form" onsubmit="AdminApp.handleLogin(event)">
                  <div class="form-group">
                    <label class="form-label">Administrator Email *</label>
                    <input type="email" name="email" required value="admin@ddunotes.ac.in" placeholder="admin@ddunotes.ac.in" class="form-control" autofocus>
                  </div>

                  <div class="form-group">
                    <label class="form-label">Administrator Password *</label>
                    <input type="password" name="password" required placeholder="Enter Admin Password" class="form-control">
                  </div>

                  <div id="admin-login-error" style="display: none; background: rgba(239, 68, 68, 0.12); color: var(--accent-rose); padding: 10px 14px; border-radius: var(--radius-sm); font-size: 0.82rem; margin-bottom: 16px; font-weight: 600;">
                  </div>

                  <button type="submit" class="btn-primary" style="width: 100%; padding: 12px; font-size: 0.95rem;">
                    Authenticate as Administrator
                  </button>
                </form>

                <div style="margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border); text-align: center; font-size: 0.78rem; color: var(--text-muted);">
                  Unauthorized access attempts to this administrative console are logged and monitored.
                </div>
              </div>
            </div>
          `;
        }
      },

      async handleLogin(e) {
        e.preventDefault();
        const form = e.target;
        const email = form.email.value.trim();
        const password = form.password.value;
        const errDiv = document.getElementById("admin-login-error");

        errDiv.style.display = "none";
        try {
          const res = await Auth.login(email, password, true);
          if (!res.success) {
            errDiv.innerText = res.error;
            errDiv.style.display = "block";
            return;
          }
          if (res.user.role !== "ADMIN") {
            Auth.logout(false);
            errDiv.innerText = "Access Denied: This account does not possess administrator privileges.";
            errDiv.style.display = "block";
            return;
          }
          App.toast("Administrator verified successfully!", "success");
          this.renderState();
        } catch (err) {
          errDiv.innerText = err.message;
          errDiv.style.display = "block";
        }
      },

      logout() {
        Auth.logout(false);
        this.renderState();
        App.toast("Administrator logged out.", "info");
      }
    };

    // Shared UI helpers for Admin app
    const App = {
      theme: localStorage.getItem("ddu_theme") || "light",
      initTheme() {
        if (this.theme === "dark" || (!localStorage.getItem("ddu_theme") && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.setAttribute("data-theme", "dark");
          this.theme = "dark";
        } else {
          document.documentElement.setAttribute("data-theme", "light");
          this.theme = "light";
        }
        const btn = document.getElementById("theme-toggle-btn");
        if (btn) btn.innerHTML = this.theme === "dark" ? "☀️" : "🌙";
      },
      toggleTheme() {
        this.theme = this.theme === "light" ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", this.theme);
        localStorage.setItem("ddu_theme", this.theme);
        const btn = document.getElementById("theme-toggle-btn");
        if (btn) btn.innerHTML = this.theme === "dark" ? "☀️" : "🌙";
      },
      toast(message, type = "info") {
        let container = document.getElementById("toast-container");
        if (!container) {
          container = document.createElement("div");
          container.id = "toast-container";
          document.body.appendChild(container);
        }
        const toast = document.createElement("div");
        toast.className = `toast ${type}`;
        toast.innerHTML = `<span>${type === 'success' ? '✓' : type === 'error' ? '✕' : 'ℹ'}</span> <span>${escapeHtml(message)}</span>`;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3500);
      },
      getGoogleDriveId(url) {
        if (!url || typeof url !== 'string') return null;
        const m1 = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
        if (m1) return m1[1];
        const m2 = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
        if (m2) return m2[1];
        const m3 = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
        if (m3) return m3[1];
        return null;
      },
      openPdfViewer(fileUrl, title = "Document Preview") {
        const modal = document.getElementById("pdf-viewer-modal");
        const titleEl = document.getElementById("pdf-viewer-title");
        const frame = document.getElementById("pdf-viewer-frame");
        const imgEl = document.getElementById("pdf-viewer-image");
        const downloadBtn = document.getElementById("pdf-viewer-download-link");
        const externalBtn = document.getElementById("pdf-viewer-external-link");
        const mobileTip = document.getElementById("pdf-viewer-mobile-tip");

        fileUrl = (fileUrl || "").trim();
        if (titleEl) titleEl.innerText = title;

        const driveId = this.getGoogleDriveId(fileUrl);
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const cleanUrlPath = fileUrl.split("?")[0].toLowerCase();
        const isImage = cleanUrlPath.endsWith(".png") || cleanUrlPath.endsWith(".jpg") || cleanUrlPath.endsWith(".jpeg") || cleanUrlPath.endsWith(".webp") || cleanUrlPath.endsWith(".gif");

        let embedUrl = fileUrl;
        let externalUrl = fileUrl;
        let downloadUrl = fileUrl;

        if (driveId) {
          embedUrl = `https://drive.google.com/file/d/${driveId}/preview`;
          externalUrl = `https://drive.google.com/file/d/${driveId}/view?usp=sharing`;
          downloadUrl = `https://drive.google.com/uc?export=download&id=${driveId}`;
        } else {
          const absoluteUrl = (fileUrl.startsWith("http://") || fileUrl.startsWith("https://"))
            ? fileUrl
            : (window.location.origin + (fileUrl.startsWith("/") ? "" : "/") + fileUrl);
          externalUrl = absoluteUrl;
          downloadUrl = absoluteUrl;
          if (isImage) {
            embedUrl = absoluteUrl;
          } else if (isMobile) {
            embedUrl = `https://docs.google.com/viewer?url=${encodeURIComponent(absoluteUrl)}&embedded=true`;
          } else {
            embedUrl = absoluteUrl;
          }
        }

        if (isImage && !driveId) {
          if (frame) {
            frame.style.display = "none";
            frame.src = "about:blank";
          }
          if (imgEl) {
            imgEl.src = embedUrl;
            imgEl.style.display = "block";
          }
        } else {
          if (imgEl) {
            imgEl.style.display = "none";
            imgEl.src = "";
          }
          if (frame) {
            frame.style.display = "block";
            frame.src = embedUrl;
          }
        }

        if (downloadBtn) {
          downloadBtn.href = downloadUrl;
          downloadBtn.innerHTML = isImage
            ? `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Download Image`
            : `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Download Document`;
          if (driveId) {
            downloadBtn.removeAttribute("download");
            downloadBtn.target = "_blank";
            downloadBtn.rel = "noopener noreferrer";
          } else {
            downloadBtn.setAttribute("download", "");
            downloadBtn.removeAttribute("target");
            downloadBtn.removeAttribute("rel");
          }
        }

        if (externalBtn) {
          externalBtn.href = externalUrl;
          externalBtn.target = "_blank";
          externalBtn.rel = "noopener noreferrer";
        }

        if (mobileTip) {
          mobileTip.style.display = (isMobile && !isImage) ? "block" : "none";
        }

        if (modal) modal.classList.add("active");
      },
      closeAllModals() {
        document.querySelectorAll(".modal-overlay").forEach(m => m.classList.remove("active"));
        const frame = document.getElementById("pdf-viewer-frame");
        if (frame) frame.src = "about:blank";
      },
      showGenericModal(htmlContent) {
        let container = document.getElementById("generic-modal-overlay");
        if (!container) {
          container = document.createElement("div");
          container.id = "generic-modal-overlay";
          container.className = "modal-overlay";
          document.body.appendChild(container);
        }
        container.innerHTML = htmlContent;
        container.classList.add("active");
      },
      closeActiveModal() {
        const generic = document.getElementById("generic-modal-overlay");
        if (generic) generic.classList.remove("active");
        this.closeAllModals();
      }
    };

    window.addEventListener("DOMContentLoaded", () => AdminApp.init());
  </script>
</body>
</html>
